name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://learnly:learnly@localhost:5432/learnly

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: learnly
          POSTGRES_PASSWORD: learnly
          POSTGRES_DB: learnly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learnly -d learnly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
      - name: Run migrations
        run: cargo sqlx migrate run
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo sqlx prepare --workspace --check
