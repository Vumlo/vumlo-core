name: CI

on:
  # A pull request is checked once. What reaches main is checked again by release.yml, which calls this workflow
  # when a new version is to be released.
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://vumlo:vumlo@localhost:5432/vumlo

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        # The optional modules (ADR-0054) are Cargo features. Every feature set is built and
        # tested: none, then each module alone, then all together. The only module today is the
        # test-only `dummy`, so "alone" and "all" are the same row; a new module adds rows.
        features: ["", "dummy"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vumlo
          POSTGRES_PASSWORD: vumlo
          POSTGRES_DB: vumlo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vumlo -d vumlo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-bin: true
          key: ${{ matrix.features }}
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
      - name: Run migrations
        run: cargo sqlx migrate run
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features "${{ matrix.features }}" -- -D warnings
      - run: cargo test --workspace --features "${{ matrix.features }}"
      - run: cargo test --workspace --features "${{ matrix.features }}" -- --test-threads=16
      # --all-features: the same answer in every row, so it runs in one.
      - name: The offline query data covers every feature set
        if: matrix.features == ''
        run: cargo sqlx prepare --workspace --check -- --all-targets --all-features
      - name: Build offline, tests included
        run: SQLX_OFFLINE=true cargo check --workspace --all-targets --features "${{ matrix.features }}"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      # The web build reads only what `vumlo-cli brand apply` generated (ADR-0054).
      - name: Generate the branding
        working-directory: backend
        env:
          SQLX_OFFLINE: "true"
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
        run: |
          cargo run -q -p vumlo-cli -- init --dir ..
          cargo run -q -p vumlo-cli -- --config ../vumlo.toml brand apply
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # The desktop app (ADR-0056): the Rust crate's own checks, the unit tests of the installer's configuration, and
  # the whole path from vumlo.toml to a program, without the installer (that is for the institution's own workflow,
  # desktop/release/desktop-release.yml).
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            desktop
      - name: The libraries Tauri links on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf
      - name: Generate the branding
        working-directory: backend
        env:
          SQLX_OFFLINE: "true"
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
        run: |
          cargo run -q -p vumlo-cli -- init --dir ..
          cargo run -q -p vumlo-cli -- --config ../vumlo.toml brand apply
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - name: Format, lints and tests of the crate
        working-directory: desktop
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: From the configuration to a program
        working-directory: desktop
        run: node scripts/build.mjs -- --debug --no-bundle
