name: CI

on:
  # A pull request is checked once. What reaches main is checked again by release.yml, which calls this workflow
  # when a new version is to be released.
  pull_request:
  workflow_call:

# A new push to a pull request replaces the run in progress. Anything else (the release gate) has a group of its own.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://vumlo:vumlo@localhost:5432/vumlo

jobs:
  # A pull request that touches nothing a job reads does not run it (a change to the docs does not build the backend).
  # Anything else, the release gate included, runs every job.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      web: ${{ steps.f.outputs.web }}
      desktop: ${{ steps.f.outputs.desktop }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          files=""
          if [ "$EVENT" = pull_request ]; then files="$(git diff --name-only "origin/$BASE...HEAD")"; fi
          hit() { [ "$EVENT" != pull_request ] || printf '%s\n' "$files" | grep -qE "$1"; }
          # What each job reads. The backend tests also read the versions in web/ and desktop/, deploy/ and the logo.
          ci='^\.github/workflows/ci\.yml$'
          {
            hit "$ci|^(backend|brand|deploy)/|^web(-admin)?/package\.json$|^desktop/(package\.json|Cargo\.toml)$|^rust-toolchain" && echo backend=true || echo backend=false
            hit "$ci|^(web|web-admin|backend|brand)/|^deploy/(vumlo\.example\.toml|env\.example)$" && echo web=true || echo web=false
            hit "$ci|^(desktop|web|backend|brand)/|^deploy/(vumlo\.example\.toml|env\.example)$" && echo desktop=true || echo desktop=false
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  check:
    name: check${{ matrix.label }}
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        # The optional modules (ADR-0054) are Cargo features. Every feature set is built and
        # tested: none, then each module alone, then all together. The only module today is the
        # test-only `dummy`, so "alone" and "all" are the same row; a new module adds rows.
        # The tests also run with 16 threads (CLAUDE.md §14), which finds tests that depend on timing under load; that
        # does not depend on the feature set, so it is a row of its own beside the others and not a second pass in each.
        include:
          - { label: "", features: "", threads: "" }
          - { label: " (dummy)", features: "dummy", threads: "" }
          - { label: " (16 threads)", features: "", threads: "16" }
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vumlo
          POSTGRES_PASSWORD: vumlo
          POSTGRES_DB: vumlo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vumlo -d vumlo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-bin: true
          key: ${{ matrix.features }}-${{ matrix.threads }}
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
      - name: Run migrations
        run: cargo sqlx migrate run
      # `sqlx::query!` of a module is checked against this database, and every module is a workspace member whatever
      # the feature set, so its tables must exist. The module's own migrator (schema `mod_<id>`) is the Rust code the
      # check is compiling; here the files are applied directly.
      - name: Create the tables of the modules
        run: |
          for dir in crates/modules/*/migrations; do
            id="$(basename "$(dirname "$dir")")"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "CREATE SCHEMA IF NOT EXISTS mod_$id"
            for file in "$dir"/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$file"; done
          done
      - if: matrix.threads == ''
        run: cargo fmt --all --check
      - if: matrix.threads == ''
        run: cargo clippy --workspace --all-targets --features "${{ matrix.features }}" -- -D warnings
      - if: matrix.threads == ''
        run: cargo test --workspace --features "${{ matrix.features }}"
      - if: matrix.threads == '16'
        run: cargo test --workspace --features "${{ matrix.features }}" -- --test-threads=16
      # --all-features: the same answer in every row, so it runs in one.
      - name: The offline query data covers every feature set
        if: matrix.features == '' && matrix.threads == ''
        run: cargo sqlx prepare --workspace --check -- --all-targets --all-features
      - name: Build offline, tests included
        if: matrix.threads == ''
        run: SQLX_OFFLINE=true cargo check --workspace --all-targets --features "${{ matrix.features }}"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      # The web build reads only what `vumlo-cli brand apply` generated (ADR-0054).
      - name: Generate the branding
        working-directory: backend
        env:
          SQLX_OFFLINE: "true"
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
        run: |
          cargo run -q -p vumlo-cli -- init --dir ..
          cargo run -q -p vumlo-cli -- --config ../vumlo.toml brand apply
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # The admin console (ADR-0095): a static app of its own that reads the shared parts of web/src and the same branding.
  console:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Generate the branding
        working-directory: backend
        env:
          SQLX_OFFLINE: "true"
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
        run: |
          cargo run -q -p vumlo-cli -- init --dir ..
          cargo run -q -p vumlo-cli -- --config ../vumlo.toml brand apply
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # The desktop app (ADR-0056): the Rust crate's own checks, the unit tests of the installer's configuration, and
  # the whole path from vumlo.toml to a program, without the installer (that is for the institution's own workflow,
  # desktop/release/desktop-release.yml).
  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            desktop
      - name: The libraries Tauri links on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf
      - name: Generate the branding
        working-directory: backend
        env:
          SQLX_OFFLINE: "true"
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
        run: |
          cargo run -q -p vumlo-cli -- init --dir ..
          cargo run -q -p vumlo-cli -- --config ../vumlo.toml brand apply
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - name: Format, lints and tests of the crate
        working-directory: desktop
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: From the configuration to a program
        working-directory: desktop
        run: node scripts/build.mjs -- --debug --no-bundle
