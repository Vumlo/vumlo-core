name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://vumlo:vumlo@localhost:5432/vumlo

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vumlo
          POSTGRES_PASSWORD: vumlo
          POSTGRES_DB: vumlo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vumlo -d vumlo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-bin: true
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
      - name: Run migrations
        run: cargo sqlx migrate run
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo sqlx prepare --workspace --check -- --all-targets
      - name: Build offline, tests included
        run: SQLX_OFFLINE=true cargo check --workspace --all-targets
