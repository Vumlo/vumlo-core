name: Release

# A tag vX.Y.Z publishes the release X.Y.Z: the CI checks, the source archive with its checksum, a
# proof that the archive builds and runs, and the GitHub Release. See RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        name: The tag is the workspace version, is on main, and has a changelog entry
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' backend/Cargo.toml)
          web=$(sed -n 's/^  "version": "\(.*\)",/\1/p' web/package.json)
          compose=$(sed -n 's/.*VUMLO_VERSION:-\([^}]*\)}.*/\1/p' deploy/compose.yaml | sort -u)
          desktop=$(sed -n 's/^  "version": "\(.*\)",/\1/p' desktop/package.json)
          desktop_crate=$(sed -n '/^\[package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' desktop/Cargo.toml)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::the tag is ${GITHUB_REF_NAME}, but the workspace version is ${version}"
            exit 1
          fi
          if [ "${web}" != "${version}" ] || [ "${compose}" != "${version}" ]; then
            echo "::error::web/package.json (${web}) and deploy/compose.yaml (${compose}) must say ${version}"
            exit 1
          fi
          if [ "${desktop}" != "${version}" ] || [ "${desktop_crate}" != "${version}" ]; then
            echo "::error::desktop/package.json (${desktop}) and desktop/Cargo.toml (${desktop_crate}) must say ${version}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main: release only from main"
            exit 1
          fi
          if ! grep -q "^## \[${version}\] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  gate:
    needs: version
    uses: ./.github/workflows/ci.yml

  archive:
    needs: [version, gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: .github/release/make-archive.sh "${{ needs.version.outputs.version }}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/
          if-no-files-found: error

  # The archive, as a stranger gets it, built from scratch and run: docs/install.md, followed.
  verify:
    needs: [version, archive]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist/
      - run: .github/release/verify-archive.sh dist "${{ needs.version.outputs.version }}"

  release:
    needs: [version, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist/
      - name: The changelog entry is the release notes
        run: |
          awk -v v="${VERSION}" '/^## \[/ { on = index($0, "[" v "]") == 4; next } /^\[[^]]+\]: / { on = 0 } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::the CHANGELOG.md entry for ${VERSION} is empty"
            exit 1
          fi
          cat notes.md
      - run: >
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "Vumlo ${VERSION}"
          --notes-file notes.md "dist/vumlo-${VERSION}-source.tar.gz" dist/SHA256SUMS
