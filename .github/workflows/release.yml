name: Release

# The release X.Y.Z is published when a commit with that version reaches main (a merged pull request) and the tag
# vX.Y.Z does not exist yet: the CI checks, the source archive with its checksum, a proof that the archive builds
# and runs, and the GitHub Release, which creates the tag on that commit. A push to main whose version is already
# tagged does nothing. That the versions of the backend, web, desktop and compose file agree is a test of the CI
# checks. See RELEASING.md.
on:
  push:
    branches: [main]

# Two merges in a row release one after the other, never at the same time.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Is there a release to make?
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' backend/Cargo.toml)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "v${version} exists: nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  gate:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  # The archive, as a stranger gets it, built from scratch and run (docs/install.md, followed); then the release,
  # which creates the tag on the commit that was checked.
  release:
    needs: [version, gate]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: .github/release/make-archive.sh "${VERSION}" dist
      - run: .github/release/verify-archive.sh dist "${VERSION}"
      - name: The changelog entry is the release notes
        run: |
          awk -v v="${VERSION}" '/^## \[/ { on = index($0, "[" v "]") == 4; next } /^\[[^]]+\]: / { on = 0 } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no entry for ${VERSION}"
            exit 1
          fi
      - run: >
          gh release create "v${VERSION}" --target "${GITHUB_SHA}" --title "Vumlo ${VERSION}"
          --notes-file notes.md "dist/vumlo-${VERSION}-source.tar.gz" dist/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
