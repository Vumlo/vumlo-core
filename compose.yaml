services:
  postgres:
    image: postgres:18
    # One test database per running test, five connections each (ADR-0036).
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: vumlo
      POSTGRES_PASSWORD: vumlo
      POSTGRES_DB: vumlo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vumlo -d vumlo"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Dev only (ADR-0045): takes the mail the API sends. The inbox is on http://127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"

  # The API. The web app runs outside Docker and reaches it on http://127.0.0.1:8080.
  # For development only. The installation example is deploy/compose.yaml.
  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: ["sh", "-c", "vumlo-server migrate && exec vumlo-server serve"]
    environment:
      VUMLO__SERVER__BIND_ADDR: "0.0.0.0:8080"
      # The origin the browser uses: the web app on :3000, which proxies /api/v1 here.
      VUMLO__SERVER__PUBLIC_ORIGIN: ${VUMLO_PUBLIC_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgres://vumlo:vumlo@postgres:5432/vumlo
      VUMLO__DATABASE__MAX_CONNECTIONS: "10"
      VUMLO__LOG__FORMAT: pretty
      VUMLO__AUTH__COOKIE_SECURE: "false" # plain HTTP, local use only
      VUMLO__INSTITUTION__NAME: ${VUMLO_INSTITUTION_NAME:-Example University}
      # Recorded in the database on first start and cannot be changed later (ADR-0031).
      VUMLO__INSTITUTION__MODE: ${VUMLO_INSTITUTION_MODE:-university}
      # Self-registration and password reset (ADR-0045, ADR-0046). Anyone at these domains may sign up.
      VUMLO__AUTH__ALLOWED_DOMAINS: ${VUMLO_ALLOWED_DOMAINS:-example.edu}
      VUMLO__MAIL__FROM: Vumlo <no-reply@example.edu>
      VUMLO__MAIL__TRANSPORT__KIND: smtp
      VUMLO__MAIL__TRANSPORT__HOST: mailpit
      VUMLO__MAIL__TRANSPORT__PORT: "1025"
      VUMLO__MAIL__TRANSPORT__TLS: none
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
