services:
  postgres:
    image: postgres:18
    # One test database per running test, five connections each (ADR-0036).
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: learnly
      POSTGRES_PASSWORD: learnly
      POSTGRES_DB: learnly
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnly -d learnly"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
