services:
  postgres:
    image: postgres:18
    # One test database per running test, five connections each (ADR-0036).
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: learnly
      POSTGRES_PASSWORD: learnly
      POSTGRES_DB: learnly
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnly -d learnly"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Dev only (ADR-0045): takes the mail the API sends. The inbox is on http://127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"

  # The API. The web app runs outside Docker and reaches it on http://127.0.0.1:8080.
  server:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: ["sh", "-c", "learnly-server migrate && exec learnly-server serve"]
    environment:
      LEARNLY__SERVER__BIND_ADDR: "0.0.0.0:8080"
      # The origin the browser uses: the web app on :3000, which proxies /api/v1 here.
      LEARNLY__SERVER__PUBLIC_ORIGIN: ${LEARNLY_PUBLIC_ORIGIN:-http://localhost:3000}
      LEARNLY__DATABASE__URL: postgres://learnly:learnly@postgres:5432/learnly
      LEARNLY__DATABASE__MAX_CONNECTIONS: "10"
      LEARNLY__LOG__FORMAT: pretty
      LEARNLY__AUTH__COOKIE_SECURE: "false" # plain HTTP, local use only
      LEARNLY__INSTITUTION__NAME: ${LEARNLY_INSTITUTION_NAME:-Example University}
      # Recorded in the database on first start and cannot be changed later (ADR-0031).
      LEARNLY__INSTITUTION__MODE: ${LEARNLY_INSTITUTION_MODE:-university}
      # Self-registration and password reset (ADR-0045, ADR-0046). Anyone at these domains may sign up.
      LEARNLY__AUTH__ALLOWED_DOMAINS: ${LEARNLY_ALLOWED_DOMAINS:-example.edu}
      LEARNLY__MAIL__FROM: Learnly <no-reply@example.edu>
      LEARNLY__MAIL__TRANSPORT__KIND: smtp
      LEARNLY__MAIL__TRANSPORT__HOST: mailpit
      LEARNLY__MAIL__TRANSPORT__PORT: "1025"
      LEARNLY__MAIL__TRANSPORT__TLS: none
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
