[package]
name = "vumlo-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The Vumlo desktop client (Tauri 2): the web app in a native window, with the network, the token and the offline store in Rust (ADR-0056)."
publish = false

[lib]
name = "vumlo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
