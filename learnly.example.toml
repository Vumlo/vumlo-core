# Copy to learnly.toml. Any key can be overridden with LEARNLY__<SECTION>__<KEY>,
# e.g. LEARNLY__DATABASE__URL.

[server]
bind_addr = "127.0.0.1:8080"
# The origin browsers use to reach the API (no path). Cookie-authenticated POST/PATCH/DELETE
# requests must send exactly this Origin.
public_origin = "http://localhost:5173"
# Behind a reverse proxy that overwrites this header, rate limits use it instead of the TCP peer.
# client_ip_header = "x-real-ip"
# Trusted browser frontends hosted on another origin (ADR-0041). Each entry is an exact origin:
# scheme://host[:port], lowercase, no path, no wildcard, no default port. Empty (the default) means
# no CORS headers at all. A listed origin gets CORS with credentials and may send cookie-authenticated
# writes, so its JavaScript acts with the user's rights: list only frontends you trust. Cookies are
# SameSite=Lax, so cookie login works across origins only for a frontend on the same site as the API
# (app.example.edu -> lms.example.edu); a frontend on another site must use bearer tokens.
# allowed_origins = ["https://app.example.edu"]

[database]
url = "postgres://learnly:learnly@localhost:5432/learnly"
max_connections = 10

[log]
format = "pretty" # "pretty" | "json"

[auth]
password_min_length = 12 # 8..=128
cookie_secure = false     # keep true (the default) in production; false only for plain-HTTP dev
allowed_domains = []      # used by self-registration (task 004)
# Login limits (ADR-0038). A client is an IPv4 address or the /64 of an IPv6 one. A school or a
# lecture hall behind one address raises login_ip_burst (and lowers login_ip_replenish_seconds):
# with 300 students logging in at the start of a lesson, 50 attempts and one more per second are not
# enough. Behind a reverse proxy set server.client_ip_header, or every client is the proxy.
login_ip_burst = 50                # attempts one client may make in a burst (1..=1000000)
login_ip_replenish_seconds = 1     # seconds until one attempt is given back (1..=3600)
login_account_max_attempts = 10    # attempts per account per window (1..=1000)
login_account_window_minutes = 15  # the window (1..=1440)
max_concurrent_hashes = 8          # password hashes and checks at once, ~19 MiB each (1..=256)

[institution]
name = "Example University"
# REQUIRED. Choose it before the first start: it is recorded in the database then and cannot be
# changed later (a different value stops the server).
#   "school"     - every piece of work is graded 1-12; the default grading scale is "twelve"
#   "university" - points add up to 100 per course; the default grading scale is "hundred"
mode = "university"
# Limits assignment points: "twelve" = at most 12 per assignment, "hundred" = the regular
# assignments of a course add up to at most 100. Optional; by default it follows the mode.
# grading_scale = "hundred"

[editor]
# What the document editor may offer. A configuration can only narrow what the code allows;
# an unknown profile, feature or provider stops the server at startup.
# Providers a video block may name. An empty list switches video off.
video_providers = ["youtube", "vimeo"]
# Narrow a profile (full, question, option, student) to the listed features. Features:
# headings, text_styles, links, lists, quote, divider, table, code, math, mermaid, video.
# [editor.profiles.student]
# features = ["text_styles", "links", "lists", "code", "math"]
