# Copy to vumlo.toml (or run `vumlo-cli init`). Precedence, lowest first: the defaults below,
# this file, VUMLO__<SECTION>__<KEY> environment variables, then --set section.key=value flags.
# Check it with `vumlo-cli config check`.
#
# Secrets never go in this file. They come from the environment (or the env file named by
# [cli].env_file): DATABASE_URL, VUMLO__AUTH__GOOGLE__CLIENT_SECRET, VUMLO__MAIL__TRANSPORT__PASSWORD, VUMLO__FILES__S3__ACCESS_KEY, VUMLO__FILES__S3__SECRET_KEY.
# A secret written here stops the server and `vumlo-cli config check`.
#
# Changing the file means: restart the server. Changing [institution] or [modules] also means
# `vumlo-cli brand apply`, then rebuilding the web app.
config_version = 1

[server]
bind_addr = "127.0.0.1:8080"
# The origin browsers use to reach Vumlo (no path): where the web app is served. Cookie-authenticated
# POST/PATCH/DELETE requests must send exactly this Origin, and every URL the installation
# publishes (the API, mail links, the manifest) is derived from it. Production: https://lms.example.edu
public_origin = "http://localhost:3000"
# The origin of the admin console (ADR-0095): its own address, with its own sign-in for administrators.
# Administration is refused to a session that did not come from here. It differs from public_origin.
# Production: https://admin.lms.example.edu
admin_origin = "http://localhost:3001"
# Behind a reverse proxy that overwrites this header, rate limits use it instead of the TCP peer.
# client_ip_header = "x-real-ip"
# Trusted browser frontends hosted on another origin (ADR-0041). Each entry is an exact origin:
# scheme://host[:port], lowercase, no path, no wildcard, no default port. Empty (the default) means
# no CORS headers at all. A listed origin gets CORS with credentials and may send cookie-authenticated
# writes, so its JavaScript acts with the user's rights: list only frontends you trust. Cookies are
# SameSite=Lax, so cookie login works across origins only for a frontend on the same site as the API
# (app.example.edu -> lms.example.edu); a frontend on another site must use bearer tokens.
# allowed_origins = ["https://app.example.edu"]

[database]
# The URL is a secret: DATABASE_URL=postgres://user:password@host:5432/vumlo in the environment.
max_connections = 10

[log]
format = "pretty" # "pretty" | "json"

[web]
dir = "web" # where `vumlo-cli build web` runs the web build, relative to this file

[cli]
env_file = ".env"   # the secrets file vumlo-cli reads (KEY=VALUE lines); never overrides the environment
# core_url = "http://127.0.0.1:8080"   # where `vumlo-cli doctor` reaches the core; default server.public_origin

[auth]
password_min_length = 12 # 8..=128
cookie_secure = false     # keep true (the default) in production; false only for plain-HTTP dev
allowed_domains = []      # who may sign up themselves, e.g. ["example.edu"] (ADR-0046); empty: nobody
# Login limits (ADR-0038). A client is an IPv4 address or the /64 of an IPv6 one. A school or a
# lecture hall behind one address raises login_ip_burst (and lowers login_ip_replenish_seconds):
# with 300 students logging in at the start of a lesson, 50 attempts and one more per second are not
# enough. Behind a reverse proxy set server.client_ip_header, or every client is the proxy.
login_ip_burst = 50                # attempts one client may make in a burst (1..=1000000)
login_ip_replenish_seconds = 1     # seconds until one attempt is given back (1..=3600)
login_account_max_attempts = 10    # attempts per account per window (1..=1000)
login_account_window_minutes = 15  # the window (1..=1440)
max_concurrent_hashes = 8          # password hashes and checks at once, ~19 MiB each (1..=256)

# Sign-in with Google (ADR-0047). Without this section the two endpoints answer 404. A Google
# account needs a verified email in allowed_domains. Create the client in the Google Cloud console
# (a web application) and list redirect_uri as an authorized redirect URI.
# [auth.google]
# client_id = "....apps.googleusercontent.com"
# The client secret is VUMLO__AUTH__GOOGLE__CLIENT_SECRET in the environment, not a key here.
# redirect_uri = "https://lms.example.edu/auth/google/callback"   # the callback page of the web app

# Outgoing mail (ADR-0084 to ADR-0086): the links of self-registration and password reset, and the
# mail plugins with the scope mail:send send. Without this section register and reset are off (404)
# and plugins get 503. Every mail is a row sent by the mail worker, never inside a request.
# [mail]
# from = "Vumlo <no-reply@example.edu>"
# link_base = "https://lms.example.edu"  # where the links point; default server.public_origin
# plugin_hourly_calls = 500              # 1 to 100000: accepted mail calls one plugin may make in an hour
# recipient_daily = 20                   # 1 to 1000: plugin messages one person may get in 24 hours
# max_audience = 2000                    # 1 to 10000: the most people one call may address (more is 422)
# retention_days = 30                    # 1 to 3650: days an address is kept after a plugin message ends
# journal_days = 180                     # retention_days to 3650: days the journal (vumlo-cli mail list) is kept
# [mail.transport]
# kind = "smtp"                          # "smtp" | "file"
# host = "smtp.example.edu"
# port = 587                             # default: 587 for starttls, 465 for tls, 25 for none
# tls = "starttls"                       # "starttls" | "tls" | "none" (none: a local test server)
# username = "vumlo"
# The SMTP password is VUMLO__MAIL__TRANSPORT__PASSWORD in the environment, not a key here.
# For development, write every message to a file instead:
# kind = "file"
# dir = "/tmp/vumlo-mail"

# Uploaded files (ADR-0069). The database backup does not contain them: back up the directory or the
# bucket too. A reverse proxy in front of the server must allow bodies of max_size.
[files]
storage = "local"      # "local" | "s3"
# path = "files"       # the directory of the local storage, relative to this file; default "files". The service must be able to write it (docs/install.md)
max_size = 52428800    # bytes, 1 to 1073741824; the largest file (50 MiB)
# [files.s3]           # required when storage = "s3"
# endpoint = "https://s3.example.edu"   # an S3-compatible service other than AWS; https only
# bucket = "vumlo-files"
# region = "eu-north-1"
# The access key and the secret key are VUMLO__FILES__S3__ACCESS_KEY and VUMLO__FILES__S3__SECRET_KEY
# in the environment, not keys here.

[institution]
name = "Vumlo"
# REQUIRED. Choose it before the first start: it is recorded in the database then and cannot be
# changed later (a different value stops the server).
#   "school"     - every piece of work is graded 1-12; the default grading scale is "twelve"
#   "university" - points add up to 100 per course; the default grading scale is "hundred"
mode = "university"
# Limits assignment points: "twelve" = at most 12 per assignment, "hundred" = the regular
# assignments of a course add up to at most 100. Optional; by default it follows the mode.
# grading_scale = "hundred"
# What the web app shows before anyone signs in (ADR-0044). All optional. They are read at startup:
# changing one means editing this file and restarting.
# short_name = "Example"   # 1-50 characters; default: name
# language = "en"          # "en" | "uk"; default "en"
# time_zone = "Europe/Kyiv" # an IANA zone name; default "UTC"
# The colour of the web app (ADR-0083): "violet" | "blue" | "teal" | "green" | "orange" | "red".
# Changing it means `vumlo-cli brand apply` and a web rebuild.
# accent = "violet"

# Optional add-on modules (ADR-0054). Each is compiled in with a Cargo feature of the same name
# and switched on here; `vumlo-cli modules list` shows which this build has. Off by default.
# [modules]
# some-module = true
#
# The Buddy, a chat helper (feature `ai_agent`; the key is VUMLO_AI_AGENT_API_KEY in the environment). See docs/install.md.
# [modules.ai_agent]
# enabled = true
# endpoint = "https://api.openai.com/v1"
# model = "gpt-4o-mini"
# roles = "teacher,admin"   # student, teacher, admin
# daily_cap = 100           # messages per person per day; 0 = no limit
# retention_days = 30
# notice = "Your messages are sent to Example AI."

# The desktop app (docs/desktop.md). Its links look like vumlo-ucu://course?id=...; the scheme is "vumlo-" and
# the short name in ASCII letters and digits unless you name one. Two institutions' apps on one computer
# need different schemes, so name one if your short name has no ASCII letters.
# [desktop]
# url_scheme = "vumlo-ucu"

[editor]
# What the document editor may offer. A configuration can only narrow what the code allows;
# an unknown profile, feature or provider stops the server at startup.
# Providers a video block may name. An empty list switches video off.
video_providers = ["youtube", "vimeo"]
# Narrow a profile (full, question, option, student) to the listed features. Features:
# headings, text_styles, links, lists, quote, divider, table, code, math, mermaid, video, image, file.
# [editor.profiles.student]
# features = ["text_styles", "links", "lists", "code", "math"]

[plugins]
# secret_key comes from VUMLO__PLUGINS__SECRET_KEY (32 characters or more), never from this file.
# What one plugin token may do to the plugin API (ADR-0079). Every token has an allowance of its own.
api_burst = 100                # calls in a burst (1..=100000)
api_requests_per_second = 20   # calls given back per second (1..=10000)
# What one public route of a plugin (`auth = "none"`, ADR-0080) may be called, by everyone together.
public_route_burst = 10              # calls in a burst (1..=100000)
public_route_requests_per_second = 2 # calls given back per second (1..=10000)
call_log_days = 30             # days `vumlo-cli plugin calls` can look back (1..=3650)
tombstone_days = 30            # days a plugin can ask what was deleted; longer away, it reads the lists in full (ADR-0081, 1..=3650)
