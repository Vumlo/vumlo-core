[workspace]
resolver = "3"
# `crates/modules/` only holds the optional modules; each of them is a member.
members = [
    "crates/api-types",
    "crates/config",
    "crates/db",
    "crates/module-api",
    "crates/server",
    "crates/vumlo-cli",
    "crates/modules/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
argon2 = "0.6"
axum = "0.8"
axum-extra = { version = "0.12", default-features = false, features = ["cookie"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", default-features = false }
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
garde = { version = "0.23", features = ["derive"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "file-transport"] }
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "webp"] }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
resvg = { version = "0.48", default-features = false }
rpassword = "7"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros", "uuid", "chrono", "rust_decimal"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["trace", "timeout", "limit", "cors"] }
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
utoipa = { version = "6", features = ["uuid", "chrono"] }
utoipa-axum = "0.3"
utoipa-scalar = { version = "0.4", features = ["axum"] }
uuid = { version = "1", features = ["v7", "serde"] }
zxcvbn = "3"

api-types = { path = "crates/api-types" }
db = { path = "crates/db" }
module-api = { path = "crates/module-api" }
server = { path = "crates/server" }
vumlo-config = { path = "crates/config" }
# The test-only module (feature `dummy` of server and vumlo-cli); never in a default build.
vumlo-module-dummy = { path = "crates/modules/dummy" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Password hashing and strength checks are far too slow unoptimized; keep tests fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.zxcvbn]
opt-level = 3
