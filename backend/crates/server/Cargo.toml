[package]
name = "server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "vumlo-server"
path = "src/main.rs"

[features]
default = []
# Optional modules (ADR-0054): the feature of a module is named after it, on server and vumlo-cli
# alike. `dummy` is the test-only module; only the test jobs of CI build with it.
dummy = ["dep:vumlo-module-dummy", "vumlo-config/test-registry"]

[dependencies]
access.workspace = true
anyhow.workspace = true
api-types.workspace = true
auth.workspace = true
argon2.workspace = true
axum.workspace = true
axum-extra.workspace = true
chrono.workspace = true
clap.workspace = true
common.workspace = true
db.workspace = true
events.workspace = true
garde.workspace = true
lettre.workspace = true
module-api.workspace = true
openidconnect.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tower_governor.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-scalar.workspace = true
uuid.workspace = true
vumlo-config.workspace = true
vumlo-module-dummy = { workspace = true, optional = true }

[dev-dependencies]
access = { workspace = true, features = ["testing"] }
auth = { workspace = true, features = ["testing"] }
base64.workspace = true
chrono-tz.workspace = true
reqwest.workspace = true
test-support.workspace = true

[lints]
workspace = true
